name: Package Website

on:
  push:
    branches: [main, master]
    paths:
      - "pages-app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-website-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true' && vars.PAGES_PROJECT_MODE == 'git'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pages-app
    env:
      PAGES_URL: ${{ vars.PAGES_URL || format('https://{0}.pages.dev', vars.CF_PAGES_PROJECT || 'lingmo-packages') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pages-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify Git-integrated Pages deployment
        run: node scripts/verify-deployment.mjs "$PAGES_URL"
